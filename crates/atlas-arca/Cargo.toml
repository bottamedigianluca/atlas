[package]
name = "atlas-arca"
description = "Replica dei documenti ATLAS nel database di Arca Evolution (scrittura diretta delle tabelle)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
atlas-core.workspace = true
rust_decimal.workspace = true
chrono = { workspace = true, features = ["clock"] }
serde.workspace = true
thiserror.workspace = true
tiberius = { version = "0.12", default-features = false, features = ["tds73", "native-tls", "rust_decimal", "chrono", "winauth"] }
tokio = { version = "1", features = ["rt", "macros", "net"] }
tokio-util = { version = "0.7", features = ["compat"] }

[dev-dependencies]
rust_decimal_macros.workspace = true

[lints]
workspace = true
