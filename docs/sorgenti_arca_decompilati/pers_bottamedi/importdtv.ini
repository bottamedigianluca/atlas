
[Documenti]
; DefaultDoc è il documento predefinito da utilizzare
; nel caso non venga valorizzato dalla gestione ordini
DefaultDoc=DTV

; IDNotaXML definisce l'identificativo della nota XML dove inserire 
; le note provenienti dagli ordini. Se IDNotaXML manca, è = 0 o non 
; è valorizzato le note ordine verranno inserite nelle note generali
IDNotaXML=0

; UsaLotti definisce se attivare o meno la gestione lotti (0=No, 1= Si)
; Se UsaLotti manca, il valore di default è = 0 
UsaLotti=0

