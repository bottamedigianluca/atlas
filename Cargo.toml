[workspace]
resolver = "3"
members = ["crates/atlas-core", "crates/atlas-verify", "crates/atlas-arca", "crates/atlas-db", "crates/atlas-sync"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
atlas-core = { path = "crates/atlas-core" }
atlas-arca = { path = "crates/atlas-arca" }
atlas-db = { path = "crates/atlas-db" }
rust_decimal = { version = "1.36", default-features = false, features = ["std", "serde-with-str"] }
rust_decimal_macros = "1.36"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
